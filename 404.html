<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OMNI Pre-sales</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into a query string so
      // index.html can restore it via history.replaceState.
      var segmentsToKeep = 1; // number of path segments in the repo name
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
